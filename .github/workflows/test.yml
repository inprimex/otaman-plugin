name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger retained

env:
  # Force Node 24 runtime now (deprecated Node 20 removed Sep 16 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    # ce-lint-standard: ruff is the single linter+formatter for CE repos.
    # Pinned exact version per F182 doctrine; config lives in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ruff (pinned)
        run: pipx install ruff==0.16.3

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    # The name is load-bearing. A non-blocking leg shows up in the PR checks
    # list as a green tick identical to a blocking one, and that is precisely
    # how four real problems hid on macOS for months (see below). Saying
    # INFORMATIONAL in the check name is the only place a reader actually
    # looks. TestMatrixBlockingPolicy asserts this label stays.
    name: >-
      test (${{ matrix.os }}, ${{ matrix.python-version }})${{
        matrix.os != 'ubuntu-latest' && ' — INFORMATIONAL, does not gate merges' || '' }}
    runs-on: ${{ matrix.os }}
    # ubuntu is the only required gate. macOS and Windows are INFORMATIONAL.
    #
    # macOS is not blocking because macOS is not a supported platform — Roman
    # held that decision on 2026-09-23 (relayed 20260923T190124). Gating every
    # merge on a platform we have not committed to would be the worse half of
    # the trade. It is kept, and kept green, so the ground does not rot if
    # support is revisited: it went 27 failures -> 0 in #68/#69/#70 and that
    # work should not have to be redone.
    #
    # THE LABEL IS THE FIX, not the blocking flag. This leg was excused for
    # months on the theory that its failures were environmental, and in that
    # window it hid FOUR problems behind a green tick:
    #   #68  a fixture whose marker was rejected for security, so 8 dispatch
    #        assertions measured the rejection, not the outcome they named
    #   #69  13 ownership/blocked tests asserting a DENY and silently getting
    #        an ALLOW — the stub ran the wrong interpreter, identity never
    #        resolved, and the hooks' deliberate fail-open path took over
    #   #70  launch-agents.sh dying with exit 127 on stock macOS: `mapfile`
    #        is bash 4.0+ and macOS ships 3.2
    #   #70  one genuinely environmental pwsh $HOME case
    # Three of four were product or coverage defects. The failure was never
    # that the leg could not fail the build — it was that nobody read it and
    # the failures carried an unexamined label. So the check NAME now says
    # INFORMATIONAL, and the defect class that actually matters is caught by
    # tests/test_shell_bash32_portability.py, which runs on LINUX in the
    # blocking job. A portability defect catchable only where nothing blocks
    # is a defect that ships.
    #
    # Windows: ~155 failures, a separate problem (the bash hook suites need a
    # POSIX shell story there). It keeps running so the count stays visible.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout otaman-plugin
        uses: actions/checkout@v7
        with:
          path: workspace/otaman-plugin

      - name: Checkout otaman-core (sibling path-dep)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-core
          path: workspace/otaman-core

      - name: Checkout otaman-cli (sibling — MCP tools import otaman_cli.*)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-cli
          path: workspace/otaman-cli

      - name: Generate workspace pyproject.toml
        shell: bash
        working-directory: workspace
        run: |
          cat > pyproject.toml <<'EOF'
          [project]
          name = "otaman-ci-workspace"
          version = "0.0.0"
          description = "Ephemeral workspace pyproject used by CI to wire up sibling path-deps"
          requires-python = ">=3.10"

          [tool.uv.workspace]
          members = ["otaman-core","otaman-plugin"]

          [tool.uv.sources]
          otaman-core = { workspace = true }
          otaman-plugin = { workspace = true }
          EOF
          echo "Workspace pyproject written:"
          cat pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "workspace/otaman-plugin/pyproject.toml"

      - name: Install dependencies
        working-directory: workspace/otaman-plugin
        run: uv sync --extra test --no-dev

      - name: Audit maestro references
        # Linux only. Windows runner skips per core-agent's recipe. macOS
        # ships bash 3.2 which trips `set -u` on empty ALLOWED_FILES array
        # expansion inside otaman-core/scripts/audit-maestro-refs.sh
        # (bash 4+ tolerates it). Tracked in follow-up to core-agent.
        if: runner.os == 'Linux'
        working-directory: workspace/otaman-plugin
        run: |
          bash ../otaman-core/scripts/audit-maestro-refs.sh src/
          bash ../otaman-core/scripts/audit-maestro-refs.sh scripts/
          bash ../otaman-core/scripts/audit-maestro-refs.sh servers/

      - name: Run tests
        working-directory: workspace/otaman-plugin
        run: uv run pytest tests/ -v

  # Changelog-fragment gate (release-notes-sibling-coverage 2.5). Every
  # shipped-code PR carries a customer-facing fragment, or the release notes
  # silently understate the release.
  #
  # CORE-INVOKABLE — `python -m otaman_core.changelog_fragment --check`, the
  # one identical entry point every sibling wires (1.3), NOT a repo-local
  # script and NOT cli's `otaman policy check-changelog` (same logic, human
  # surface). Deliberately not copied verbatim from core's #69: this repo's
  # CI is a uv WORKSPACE (plugin + sibling checkouts), so core is installed
  # from its own checkout rather than by a bare `uv sync` here.
  changelog:
    name: changelog-fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout otaman-plugin
        uses: actions/checkout@v7
        with:
          path: otaman-plugin
          fetch-depth: 0  # full history so the base...HEAD merge-base diff resolves

      - name: Checkout otaman-core (hosts the gate)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-core
          path: otaman-core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install otaman-core
        run: uv pip install --system ./otaman-core

      - name: Fetch base ref
        working-directory: otaman-plugin
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Write PR body
        env:
          # Via env, never interpolated into the shell — a PR body is
          # attacker-controlled text and must not reach a command line.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr_body.txt"

      - name: Changelog fragment gate
        working-directory: otaman-plugin
        run: |
          python -m otaman_core.changelog_fragment --check \
            --base "origin/${{ github.base_ref }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --pr-body-file "${RUNNER_TEMP}/pr_body.txt"

  # Single stable status check for branch protection. `lint` and `test`
  # (the latter a 3-OS matrix) expand into several context names that are
  # brittle to require individually; require `ci-ok` instead. `if: always()`
  # + the explicit result gate means a failed/ skipped dependency makes
  # ci-ok FAIL (not skip) — a skipped required check would otherwise let a
  # broken PR through.
  ci-ok:
    needs: [lint, test, changelog]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs passed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} changelog=${{ needs.changelog.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::A required job did not succeed."
            exit 1
          fi
          # `changelog` is PR-only by design, so on a push to main it is
          # SKIPPED — and this job's whole point is that a skipped dependency
          # must not silently pass. So skipped is accepted for THIS job only,
          # and only because its `if:` makes the skip deterministic rather
          # than a sign something went wrong. Any other result must succeed.
          if [ "${{ needs.changelog.result }}" != "success" ] \
             && [ "${{ needs.changelog.result }}" != "skipped" ]; then
            echo "::error::changelog-fragment gate did not pass."
            exit 1
          fi
          echo "All required jobs passed."
