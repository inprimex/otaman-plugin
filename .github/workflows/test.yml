name: test

on:
  workflow_dispatch:  # manual trigger only — auto-triggers disabled until billing resolved

env:
  # Force Node 24 runtime now (deprecated Node 20 removed Sep 16 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    # ce-lint-standard: ruff is the single linter+formatter for CE repos.
    # Pinned exact version per F182 doctrine; config lives in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ruff (pinned)
        run: pipx install ruff==0.16.3

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout otaman-plugin
        uses: actions/checkout@v7
        with:
          path: workspace/otaman-plugin

      - name: Checkout otaman-core (sibling path-dep)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-core
          token: ${{ secrets.INPRIMEX_RO_TOKEN }}
          path: workspace/otaman-core

      - name: Generate workspace pyproject.toml
        shell: bash
        working-directory: workspace
        run: |
          cat > pyproject.toml <<'EOF'
          [project]
          name = "otaman-ci-workspace"
          version = "0.0.0"
          description = "Ephemeral workspace pyproject used by CI to wire up sibling path-deps"
          requires-python = ">=3.10"

          [tool.uv.workspace]
          members = ["otaman-core","otaman-plugin"]

          [tool.uv.sources]
          otaman-core = { workspace = true }
          otaman-plugin = { workspace = true }
          EOF
          echo "Workspace pyproject written:"
          cat pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "workspace/otaman-plugin/pyproject.toml"

      - name: Install dependencies
        working-directory: workspace/otaman-plugin
        run: uv sync --extra test --no-dev

      - name: Audit maestro references
        # Linux only. Windows runner skips per core-agent's recipe. macOS
        # ships bash 3.2 which trips `set -u` on empty ALLOWED_FILES array
        # expansion inside otaman-core/scripts/audit-maestro-refs.sh
        # (bash 4+ tolerates it). Tracked in follow-up to core-agent.
        if: runner.os == 'Linux'
        working-directory: workspace/otaman-plugin
        run: |
          bash ../otaman-core/scripts/audit-maestro-refs.sh src/
          bash ../otaman-core/scripts/audit-maestro-refs.sh scripts/
          bash ../otaman-core/scripts/audit-maestro-refs.sh servers/

      - name: Run tests
        working-directory: workspace/otaman-plugin
        run: uv run pytest tests/ -v
