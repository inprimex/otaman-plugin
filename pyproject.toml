[project]
name = "otaman-plugin"
version = "0.2.0"
description = "Otaman Claude Code plugin: slash commands, skills, agents, hooks, stdio MCP, launcher scripts"
requires-python = ">=3.10"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "otaman-core",
    # fastmcp powers the bus_server and estimation_server MCP servers.
    # Keep loosely pinned for now; revisit if breaking releases land.
    "fastmcp>=2,<4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The plugin distributes via Claude Code marketplace, not pip. This stub
# exists only to satisfy `uv` workspace expectations.
packages = ["src/otaman_plugin"]

# Ship the helper shell scripts inside the wheel so `otaman init` (and
# anything else that needs `<plugin>/scripts/*.sh` or `servers/run-server.sh`)
# can find them when installed via pip/pipx — not just from the dev tree.
# Without these, the post-pip-install code path emitted "WARNING: <foo>.sh
# not found" because Path(__file__).parent.parent.parent / "scripts" resolves
# to a directory that doesn't exist in installed mode.
# See `_find_plugin_script()` in src/otaman_plugin/generate_agent_config.py.
[tool.hatch.build.targets.wheel.force-include]
"scripts/spec-change-hook.sh" = "src/otaman_plugin/scripts/spec-change-hook.sh"
"scripts/post-commit-hook.sh" = "src/otaman_plugin/scripts/post-commit-hook.sh"
"scripts/check-branch.sh"    = "src/otaman_plugin/scripts/check-branch.sh"
"servers/run-server.sh"      = "src/otaman_plugin/servers/run-server.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../otaman-core/src"]

# ce-lint-standard baseline (openspec). Repos MAY add lint categories,
# MUST NOT remove baseline ones. Suppress per-line (# noqa) or via
# per-file-ignores, never by dropping a category.
[tool.ruff]
line-length = 100
target-version = "py310"
# archive/ is frozen reference material — no lint/format churn there
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# E501 only, and only where long lines are content, not code:
# - emitted CLAUDE.md/template strings (rewrapping changes generated output)
# - `# legacy:` audit annotations that must stay on the same line as the
#   legacy reference they allowlist (audit-maestro-refs.sh is line-based)
# - embedded PowerShell scripts inside test string literals
"src/otaman_plugin/generate_agent_config.py" = ["E501"]
"src/otaman_plugin/servers/bus_server.py" = ["E501"]
"src/otaman_plugin/servers/estimation_server.py" = ["E501"]
"src/otaman_plugin/scaffold_launcher.py" = ["E501"]
"src/otaman_plugin/init_presale.py" = ["E501"]
"src/otaman_plugin/discover_repos.py" = ["E501"]
"src/otaman_plugin/clone_project.py" = ["E501"]
"scripts/_secrets.py" = ["E501"]
"scripts/_resolve.py" = ["E501"]
"scripts/_models_resolve.py" = ["E501"]
"tests/test_runner_endpoint_discovery.py" = ["E501"]
"tests/test_f072_attach_no_eval.py" = ["E501"]
"tests/test_discover.py" = ["E501"]
